<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Flip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Gravity Flip: a one-button neon runner. Press Space or tap to flip gravity.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d17">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d17; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
// The game world has a fixed logical height and is scaled to fit the screen,
// so a phone sees the same amount of track ahead as a laptop does.
const H = 850, FLOOR = H * 0.8, CEIL = H * 0.2;
let W, scale, offX, offY, dpr, realW, realH;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  realW = innerWidth; realH = innerHeight;
  cv.width = Math.round(realW * dpr);
  cv.height = Math.round(realH * dpr);
  W = Math.max(1100, Math.min(2200, realW / realH * H));
  scale = Math.min(realW / W, realH / H);
  offX = (realW - W * scale) / 2;
  offY = (realH - H * scale) / 2;
}
const touchUI = matchMedia('(pointer: coarse)').matches;
addEventListener('resize', resize);
resize();

// ---------- Audio ----------
let actx;
function beep(freq, dur, type = 'square', vol = 0.08) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

// ---------- State ----------
const SIZE = 28;
let state = 'title'; // title | play | dead
let player, obstacles, particles, stars, speed, dist, score, best, spawnTimer, shake, coins, deadTime;
best = +localStorage.getItem('gravflip_best') || 0;

stars = Array.from({ length: 120 }, () => ({
  x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2
}));

function reset() {
  player = { x: W * 0.22, y: FLOOR - SIZE, vy: 0, up: false, rot: 0, trail: [] };
  obstacles = [];
  coins = [];
  particles = [];
  speed = 6;
  dist = 0;
  score = 0;
  spawnTimer = 60;
  shake = 0;
}
reset();

// ---------- Input: spacebar, or tap/click anywhere ----------
function press() {
  if (actx && actx.state === 'suspended') actx.resume();
  if (state === 'title') { reset(); state = 'play'; beep(660, 0.12); return; }
  if (state === 'dead') {
    if (performance.now() - deadTime > 500) { reset(); state = 'play'; beep(660, 0.12); }
    return;
  }
  flip();
}
addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (!e.repeat) press();
});
addEventListener('pointerdown', e => { e.preventDefault(); press(); }, { passive: false });
// stop double-tap zoom, long-press menus and scrolling on phones
for (const t of ['touchstart', 'touchend', 'touchmove', 'gesturestart', 'dblclick', 'contextmenu'])
  addEventListener(t, e => e.preventDefault(), { passive: false });

function flip() {
  player.up = !player.up;
  player.vy = player.up ? -4 : 4;
  beep(player.up ? 520 : 390, 0.08, 'triangle');
  burst(player.x + SIZE / 2, player.y + SIZE / 2, 8, '#7df9ff');
}

// ---------- Helpers ----------
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 5 + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
  }
}

function spawn() {
  const r = Math.random();
  const onFloor = Math.random() < 0.5;
  if (r < 0.55) {
    // spikes (1-3 wide)
    const n = 1 + Math.floor(Math.random() * Math.min(3, 1 + dist / 3000));
    obstacles.push({ type: 'spike', x: W + 20, w: n * 30, floor: onFloor });
  } else if (r < 0.8) {
    // block pillar
    const h = 40 + Math.random() * (FLOOR - CEIL) * 0.35;
    obstacles.push({ type: 'block', x: W + 20, w: 34, h, floor: onFloor });
  } else {
    // spikes on both sides, offset -> forces a double flip
    obstacles.push({ type: 'spike', x: W + 20, w: 60, floor: true });
    obstacles.push({ type: 'spike', x: W + 20 + 220 + speed * 8, w: 60, floor: false });
  }
  // coin
  if (Math.random() < 0.5) {
    coins.push({ x: W + 140, y: Math.random() < 0.5 ? CEIL + 30 : FLOOR - 30, t: 0 });
  }
}

function hitboxes(o) {
  if (o.type === 'block') {
    return [{ x: o.x, y: o.floor ? FLOOR - o.h : CEIL, w: o.w, h: o.h }];
  }
  // spikes: approximate with a slightly shrunken box
  return [{ x: o.x + 5, y: o.floor ? FLOOR - 22 : CEIL, w: o.w - 10, h: 22 }];
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function die() {
  state = 'dead';
  deadTime = performance.now();
  shake = 18;
  burst(player.x + SIZE / 2, player.y + SIZE / 2, 50, '#ff4f7b');
  beep(140, 0.4, 'sawtooth', 0.12);
  if (score > best) { best = score; localStorage.setItem('gravflip_best', best); }
}

// ---------- Update ----------
function update() {
  if (state === 'play') {
    speed = Math.min(16, 6 + dist / 2500);
    dist += speed;
    score = Math.floor(dist / 10);

    // gravity
    const g = player.up ? -1.1 : 1.1;
    player.vy += g;
    player.y += player.vy;
    const target = player.up ? -180 : 0;
    player.rot += (target - player.rot) * 0.2;
    if (player.y > FLOOR - SIZE) { player.y = FLOOR - SIZE; player.vy = 0; }
    if (player.y < CEIL) { player.y = CEIL; player.vy = 0; }

    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 12) player.trail.shift();

    // spawn
    spawnTimer -= speed / 6;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = 55 + Math.random() * 50 - Math.min(25, dist / 1500);
    }

    const pb = { x: player.x + 3, y: player.y + 3, w: SIZE - 6, h: SIZE - 6 };
    for (const o of obstacles) {
      o.x -= speed;
      for (const hb of hitboxes(o)) if (collide(pb, hb)) { die(); break; }
      if (state !== 'play') break;
    }
    obstacles = obstacles.filter(o => o.x + o.w > -50);

    for (const c of coins) {
      c.x -= speed; c.t += 0.1;
      if (!c.got && Math.hypot(c.x - (player.x + SIZE / 2), c.y - (player.y + SIZE / 2)) < 26) {
        c.got = true;
        dist += 500; // +50 score
        beep(990, 0.1, 'sine', 0.1);
        burst(c.x, c.y, 14, '#ffd84f');
      }
    }
    coins = coins.filter(c => c.x > -30 && !c.got);
  }

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.025;
  }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85;
}

// ---------- Draw ----------
function drawSpikes(o) {
  ctx.fillStyle = '#ff4f7b';
  const n = Math.round(o.w / 30);
  for (let i = 0; i < n; i++) {
    const x = o.x + i * 30;
    ctx.beginPath();
    if (o.floor) { ctx.moveTo(x, FLOOR); ctx.lineTo(x + 15, FLOOR - 28); ctx.lineTo(x + 30, FLOOR); }
    else { ctx.moveTo(x, CEIL); ctx.lineTo(x + 15, CEIL + 28); ctx.lineTo(x + 30, CEIL); }
    ctx.fill();
  }
}

function draw() {
  // letterbox, then map the logical world onto the screen
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#05060c';
  ctx.fillRect(0, 0, realW, realH);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // background
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0b0d17'); grd.addColorStop(1, '#1a1033');
  ctx.fillStyle = grd; ctx.fillRect(-20, -20, W + 40, H + 40);

  const sp = state === 'play' ? speed : 2;
  for (const s of stars) {
    s.x -= sp * s.z * 0.0004 * 3;
    if (s.x < 0) s.x += 1;
    ctx.fillStyle = `rgba(255,255,255,${s.z * 0.8})`;
    ctx.fillRect(s.x * W, s.y * H, s.z * 2.5, s.z * 2.5);
  }

  // lanes
  ctx.fillStyle = '#151a33';
  ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.fillRect(0, 0, W, CEIL);
  ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 3;
  ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.moveTo(0, CEIL); ctx.lineTo(W, CEIL); ctx.stroke();
  ctx.shadowBlur = 0;

  // grid lines scrolling
  ctx.strokeStyle = 'rgba(125,249,255,0.12)'; ctx.lineWidth = 1;
  const off = (dist * 1) % 60;
  for (let x = -off; x < W; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, FLOOR); ctx.lineTo(x - 40, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, CEIL); ctx.lineTo(x - 40, 0); ctx.stroke();
  }

  // obstacles
  ctx.shadowColor = '#ff4f7b'; ctx.shadowBlur = 15;
  for (const o of obstacles) {
    if (o.type === 'spike') drawSpikes(o);
    else {
      ctx.fillStyle = '#b44fff';
      ctx.fillRect(o.x, o.floor ? FLOOR - o.h : CEIL, o.w, o.h);
    }
  }
  ctx.shadowBlur = 0;

  // coins
  for (const c of coins) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(Math.abs(Math.cos(c.t)), 1);
    ctx.fillStyle = '#ffd84f'; ctx.shadowColor = '#ffd84f'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // player
  if (state !== 'dead') {
    player.trail.forEach((t, i) => {
      ctx.fillStyle = `rgba(125,249,255,${i / player.trail.length * 0.3})`;
      const s = SIZE * (i / player.trail.length);
      ctx.fillRect(t.x - (12 - i) * 4 + (SIZE - s) / 2, t.y + (SIZE - s) / 2, s, s);
    });
    ctx.save();
    ctx.translate(player.x + SIZE / 2, player.y + SIZE / 2);
    ctx.rotate(player.rot * Math.PI / 180);
    ctx.fillStyle = '#7df9ff'; ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 20;
    ctx.fillRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0b0d17';
    ctx.fillRect(2, -6, 6, 6); // eye
    ctx.restore();
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD (text grows when the game is drawn small, e.g. portrait phones)
  const ts = Math.min(1.8, Math.max(1, 0.6 / scale));
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${28 * ts}px monospace`;
  ctx.textAlign = 'left';
  if (state !== 'title') ctx.fillText(score, 24, 44 * ts);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#aab';
  ctx.font = `${18 * ts}px monospace`;
  ctx.fillText('BEST ' + best, W - 24, 40 * ts);

  ctx.textAlign = 'center';
  if (state === 'title') {
    ctx.fillStyle = '#7df9ff'; ctx.shadowColor = '#7df9ff'; ctx.shadowBlur = 25;
    ctx.font = `bold ${Math.min(90, W / 9)}px monospace`;
    ctx.fillText('GRAVITY FLIP', W / 2, H / 2 - 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = `${22 * ts}px monospace`;
    const blink = Math.floor(performance.now() / 500) % 2;
    if (blink) ctx.fillText(touchUI ? 'TAP to start' : 'press SPACE to start', W / 2, H / 2 + 40 * ts);
    ctx.fillStyle = '#889'; ctx.font = `${16 * ts}px monospace`;
    ctx.fillText((touchUI ? 'TAP' : 'SPACE') + ' flips gravity · dodge spikes & walls · grab coins (+50)', W / 2, H / 2 + 80 * ts);
  } else if (state === 'dead') {
    ctx.fillStyle = '#ff4f7b'; ctx.font = `bold ${Math.min(70, W / 11)}px monospace`;
    ctx.fillText('CRASHED', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = `${24 * ts}px monospace`;
    ctx.fillText('score ' + score + (score >= best && score > 0 ? '  ★ NEW BEST' : ''), W / 2, H / 2 + 25 * ts);
    ctx.fillStyle = '#aab'; ctx.font = `${18 * ts}px monospace`;
    ctx.fillText(touchUI ? 'TAP to retry' : 'press SPACE to retry', W / 2, H / 2 + 65 * ts);
  }
  ctx.restore(); // end clip

  // portrait phones: suggest turning sideways (drawn in real pixels, in the letterbox)
  if (realH > realW && offY > 40) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#889'; ctx.textAlign = 'center';
    ctx.font = '16px monospace';
    ctx.fillText('↻ turn your phone sideways', realW / 2, offY + H * scale + 32);
    ctx.fillText('for a bigger view', realW / 2, offY + H * scale + 54);
  }
}

// fixed 60 Hz simulation so speed is the same on 60/120/240 Hz screens
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(250, now - last);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
